title: "Books and teaching resources on AI in legal practice"
description: >
  Textbooks, casebooks, study aids, and open materials for teaching AI in legal practice, grouped by
  how students can get them.
intro: >
  A reading list for people teaching AI in legal practice or legal education, including non-JD
  programs: textbooks, casebooks, study aids, open materials, and course sites, with tables of
  contents for most of the books. Pick a topic on the left to see which books have a chapter on it,
  or use the + beside another topic to find the books that cover both.
  Search covers titles, authors, descriptions, chapter titles, and topics, and each result says where
  the match was found. The filters narrow by how a title can be obtained and what kind of book it is.
  Titles marked Subscription are in the West Academic Study Aids package many law libraries license.
  Prices and dates are as of the last check.
