title: "Sources for following AI and law"
description: >
  Newsletters, news sites, podcasts, blogs, and trackers for keeping up with AI, legal AI, and AI law and policy.
intro: >
  Ongoing sources for keeping up with AI in general and with AI in law: news, analysis, legal technology
  coverage, trackers, and policy. Don't try to follow everything. Pick one dependable general source and one
  tied to your own field, and build a habit you can keep. My own favorites are marked; use the My favorites
  filter to see just those. Frequency and access are as of the last check.
