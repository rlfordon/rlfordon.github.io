title: "21st Century Lawyering: Spring 2026 reading list"
course: 21st Century Lawyering
institution: The Ohio State University Moritz College of Law
term: Spring 2026
description: >
  The class-by-class readings for a law school course on legal technology and AI: LLM basics,
  prompting, legal design, ethics, hallucinations, research, vibe-coding, bias, agents, access to
  justice, and the business of law.
intro: >
  The readings I assigned in 21st Century Lawyering, a course on legal technology and generative AI
  for law students, in Spring 2026. Classes are numbered by week and meeting (1-1 is the first class
  of week one). Times are the estimates students were given for the required readings. Links were
  checked in August 2026; where a link had moved, it points to the new location.
updated: 2026-09-25
