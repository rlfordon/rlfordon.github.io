title: "A Short & Happy Guide to AI Governance and Regulation"
authors:
  - name: Kashyap Kompella
  - name: James M. Cooper
publisher: West Academic
kind: study-aid
access: subscription
via: West Academic Study Aids
price: "$30 print"
url: https://www.westacademic.com/Kompella-and-Coopers-A-Short-Happy-Guide-to-AI-Governance-and-Regulation-9798892099790
audience: [jd-students, non-jd-students, practitioners]
description: >
  Short plain-language guide to AI governance and regulation, a companion to the same authors'
  guide to AI for lawyers.
contents:
  - title: "AI Governance and Regulation in 30 Minutes or It's Free"
    note: "Ten harmful AI avatars from infringer to terminator; what governance and regulation are and the many forms regulation takes; where lawyers fit."
    topics: [ai-governance-and-risk-management, ai-regulation]
  - title: "AI Regulation: Concepts and Debates"
    note: "Privacy and data governance, fair use and scraping, open-source risk, industrial policy, Section 230, environmental impact, foundation models, antitrust, data sovereignty, national security; theories of regulation and regulatory capture."
    topics: [ai-regulation, copyright-and-training-data, consumer-protection-and-competition]
  - title: "AI Ethics"
    note: "Transparency, fairness, oversight, expert committees, proxy factors, reliability; responsible AI standards from IBM, Microsoft, Google, OpenAI, Meta, Anthropic, Apple, Walmart, Adobe, NVIDIA, Midjourney; lobbyists."
    topics: [ai-governance-and-risk-management]
  - title: "International Bodies and Agencies"
    note: "OECD, World Economic Forum, GPAI, IEEE, UNESCO, the G7 Hiroshima process, treaties; Council of Europe, EU, African Union, OAS; a new international agency; national AI safety institutes."
    topics: [international-and-comparative, ai-governance-and-risk-management]
  - title: "AI Regulation in the United States"
    note: "Statutes already on the books, the case for smart legislation, the second Trump administration."
    topics: [ai-regulation]
  - title: "AI Regulation in the European Union"
    note: "History, the EU AI Act, implications for criminal and civil matters, employment, intellectual property."
    topics: [ai-regulation, international-and-comparative]
  - title: "AI Regulation in the People's Republic of China"
    note: "The Cybersecurity Law, Beijing Principles, Data Security Law, deep synthesis rules, ethical review, risk assessment, algorithm registry, worker protections, global influence."
    topics: [ai-regulation, international-and-comparative]
  - title: "National AI Regulation Around the Globe"
    note: "Country profiles including Australia, Brazil, Chile, France, Germany, India, Israel, Japan, Saudi Arabia, Singapore, South Korea, the UAE, and the UK; geopolitical ramifications."
    topics: [ai-regulation, international-and-comparative]
  - title: "The Wise Counsel of Bar Associations"
    note: "ABA Formal Opinion 512 and Model Rules 1.1, 1.6, 1.4, 5.1, 5.3, 3.1, 3.3, 8.4, and 1.5; state bars including California, Florida, Illinois, New York, Pennsylvania, Texas, and DC; bar guidance abroad."
    topics: [professional-responsibility]
  - title: "A Call to Action"
    note: "A comparative approach to regulation; the AIM-AI governance framework with its four zones."
    topics: [ai-governance-and-risk-management, ai-regulation]
  - title: "Appendix B: The AIM-AI Governance Framework"
    note: "SAFE-AI, FAULT-AI, ABUSE-AI, and REBEL-AI zones and policy implementation."
    topics: [ai-governance-and-risk-management]
contentsSource: https://www.vitalsource.com/products/a-short-amp-happy-guide-to-ai-governance-and-kashyap-kompella-james-m-v9798317704506
