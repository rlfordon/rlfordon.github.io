description: >
  A collection of agent skills for legal education: short Markdown instruction files you install in an
  AI agent, grouped by role (student, professor, CLE, pro se). Examples include résumé coaching,
  syllabus scaffolding, and reformatting feedback against a rubric. Developed in the open on GitHub,
  with a test harness for contributed skills. License not yet set.
