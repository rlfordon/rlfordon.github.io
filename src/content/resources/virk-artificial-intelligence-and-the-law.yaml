description: >
  Edited volume of fifteen chapters on AI, law, ethics, and human rights, with most contributions
  focused on India and several comparing Indian law with the EU AI Act and the GDPR. Covers
  regulation, deepfakes, judicial use of LLMs, criminal liability, national security, intellectual
  property, and legal personhood.
