description: >
  Guides, slides, and a gallery of interactive teaching tools that law teachers built with AI assistants
  and no prior coding, from a CALI Conference 2026 session. Examples include token visualizers, prompt
  coaches, hallucination games, automation-bias simulations, and e-discovery simulations, with a
  step-by-step workflow for building and hosting your own.
