description: >
  Open-access edited volume, written largely by senior judges from Asia-Pacific and common-law
  courts, from the 4th Judicial Roundtable on the Future of Justice (April 2024). Its four parts
  cover AI in judiciaries, data protection and privacy, "truth decay" and fact-finding, and climate
  change litigation, asking how courts should respond.
