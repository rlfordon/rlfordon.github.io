title: "The EU Artificial Intelligence Act: A Thematic Commentary"
authors:
  - name: Gianclaudio Malgieri
  - name: Gloria González Fuster
  - name: Alessandro Mantelero
  - name: Gabriela Zanfir-Fortuna
edited: true
publisher: Hart Publishing
