url: https://doi.org/10.5040/9781509988570
audience: [practitioners, faculty]
description: >
  Commentary on the EU AI Act, organized by theme, with chapters keyed to the Act's articles. It
  covers prohibited practices, high-risk systems, general-purpose AI models, sandboxes, governance,
  enforcement, and AI literacy, and closes with the Act's interplay with the GDPR, the DSA, the
  Product Liability Directive, the DMA, and the Data Act.
