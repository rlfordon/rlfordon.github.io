name: Import new AI Law Librarians posts

on:
  schedule:
    - cron: '23 11 * * *' # daily, early morning US Eastern
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-ailawlibrarians
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Import new posts
        id: sync
        run: node scripts/sync-ailawlibrarians.mjs

      # Build before committing, so a post that breaks the site never reaches main.
      - name: Check the site builds
        if: steps.sync.outputs.added != '0'
        run: npm run build

      - name: Commit and push
        if: steps.sync.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/blog public/images/blog
          git commit -m "Import new posts from AI Law Librarians"
          git pull --rebase origin main
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy here.
      - name: Deploy
        if: steps.sync.outputs.added != '0'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
